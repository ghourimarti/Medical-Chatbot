[project]
name = "medeval"
version = "0.1.0"
description = "Evaluation harness for the P5 medical RAG chatbot — golden sets, RAGAS metrics, target adapters (Decision 19)"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "faiss-cpu>=1.14.3",
    "langchain>=0.3,<1",
    "langchain-community>=0.3,<0.4",
    "langchain-groq<1",
    "langchain-huggingface<1",
    "medapi",
    "pandas>=3.0.3",
    "pydantic>=2.8",
    "pypdf>=6.15.0",
    "python-dotenv>=1.0",
    "ragas>=0.4.3",
    "sentence-transformers>=5.6.0",
    # Declared explicitly (not just pulled via sentence-transformers) so the
    # workspace CPU-index pin in the root pyproject binds — a transitive requirement
    # does not pick up a [tool.uv.sources] override (P6.1a).
    "torch>=2.0",
]

[project.scripts]
medeval = "medeval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medeval"]

[tool.uv.sources]
medapi = { workspace = true }
