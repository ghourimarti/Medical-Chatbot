# Local dev stack. Grows per step: Qdrant (S3) -> Postgres/Redis (S7/S8) -> LocalStack (S9)
# -> observability (S11, via a compose profile). Only HOST ports are remapped (11xx block);
# container-internal ports stay standard so in-cluster manifests (S15) match.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${QDRANT_HTTP_PORT:-1104}:6333"
      - "${QDRANT_GRPC_PORT:-1105}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant's distroless image has no shell/curl; use its own binary as the probe.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-1102}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medbot}
      POSTGRES_USER: ${POSTGRES_USER:-medbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medbot}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medbot} -d ${POSTGRES_DB:-medbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-1103}:6379"
    command: >
      redis-server --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build:
      context: .
      dockerfile: apps/ml-service/Dockerfile
    ports:
      - "${ML_SERVICE_PORT:-1108}:8001"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}          # medcore.Settings is fail-fast; must be present
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-BAAI/bge-large-en-v1.5}
      RERANKER_MODEL_ID: ${RERANKER_MODEL_ID:-BAAI/bge-reranker-base}
      HF_HOME: /models
    volumes:
      - hf_models:/models                     # persist weights across container restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 20                             # model warmup can take a while on first boot
      start_period: 60s

  # Observability stack (D13). Behind a profile so `docker compose up` stays fast for
  # day-to-day work: `docker compose --profile obs up -d` when you need dashboards.
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.1.0
    ports:
      - "${PROMETHEUS_PORT:-1118}:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.5.1
    ports:
      - "${GRAFANA_PORT:-1119}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ── Tracing (S15.6). Behind the same `obs` profile as Prometheus/Grafana so day-to-day
  # `docker compose up` stays fast: `docker compose --profile obs up -d`.
  otel-collector:
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "${OTEL_HTTP_PORT:-1114}:4318"
      - "${OTEL_GRPC_PORT:-1115}:4317"
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otel/config.yaml:ro

  # Langfuse: the ONE sanctioned store for prompt/completion content (D18). Everything
  # else — logs, OTel spans, metrics — carries only fingerprints.
  langfuse:
    profiles: ["obs"]
    image: langfuse/langfuse:2
    ports:
      - "${LANGFUSE_WEB_PORT:-1113}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medbot}:${POSTGRES_PASSWORD:-medbot}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:${LANGFUSE_WEB_PORT:-1113}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-langfuse-dev-salt-change-me}
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  qdrant_data:
  hf_models:
  pg_data:
  prom_data:
  grafana_data:
