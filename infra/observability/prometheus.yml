# Prometheus scrape config (D13). Local/dev; EKS uses ServiceMonitors in S15.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: medbot-api
    metrics_path: /metrics
    static_configs:
      # host.docker.internal: the API usually runs on the host during development while
      # its dependencies run in compose.
      - targets: ["host.docker.internal:5007", "api:8000"]
    # Scraping is best-effort in dev; a target that is down must not stop the others.
    honor_labels: true

  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
