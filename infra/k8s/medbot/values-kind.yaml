# kind overlay — Phase 6. Cost: $0. Question answered: "are my manifests correct?"
#
# What kind CANNOT validate, and therefore what Phase 7 must (docs/DEPLOYMENT_PHASES.md):
#   * type: LoadBalancer          — kind has no cloud LB; we use ClusterIP + port-forward
#   * real StorageClasses         — kind uses local-path (hostPath under the hood)
#   * NetworkPolicy enforcement   — kindnet accepts the objects but does not enforce them
#   * cloud IAM / IRSA            — no equivalent exists
#   * capacity / autoscaling      — one machine, one kernel, one failure domain
#
# Everything else — probes, HPA objects, PDBs, ConfigMap/Secret wiring, RBAC, rollout
# behaviour, image pull, service discovery — is genuinely exercised here.

# Avoids the doubled `medbot-medbot-` prefix that Helm produces when the release name
# equals the chart name. Object names are referenced by NetworkPolicies and Service DNS,
# so keeping them short and predictable is worth the one line.
fullnameOverride: medbot

config:
  environment: dev              # NOT local: exercises the D17 fail-fast validators
  # MUST be true. The D17 validator requires secure cookies in EVERY non-local
  # environment, not just prod — an earlier "false" here (with a comment wrongly claiming
  # dev was exempt) put every pod into CrashLoopBackOff at startup. That is the validator
  # working: a misconfiguration became a loud deploy-time failure instead of a service
  # quietly issuing insecure session cookies. Harmless for local testing because browsers
  # treat localhost as a secure context and curl ignores the flag entirely.
  secureCookies: "true"

image:
  registry: ""                  # images are side-loaded with `kind load docker-image`
  pullPolicy: Never             # never reach out to a registry for a locally built tag
  tag: "0.1.0"

api:
  replicaCount: 2
  service:
    type: ClusterIP             # LoadBalancer would stay <pending> forever in kind
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  autoscaling:
    enabled: true               # requires metrics-server; see the S15 README
    minReplicas: 2
    maxReplicas: 5

mlService:
  enabled: true
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 3Gi }
  modelCache:
    enabled: true
    size: 6Gi
    storageClass: standard      # kind's built-in local-path provisioner

worker:
  # DISABLED in kind, deliberately. The worker is an SQS consumer (D11) and kind has no
  # queue, so it fails fast with "SQS_QUEUE_URL is not set" — which is the CORRECT
  # behaviour: a deployed consumer with no queue is a misconfiguration, not something to
  # paper over by idling. Deploying it here would produce a permanent CrashLoopBackOff
  # that trains you to ignore red pods.
  #
  # Its manifest is still validated by `helm template`, its ingestion path by
  # `make reindex` (--direct mode, bypasses SQS), and its full queue-driven path by real
  # SQS in Phase 7/8. Set true here only after adding LocalStack as an in-cluster dep.
  enabled: false
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1536Mi }

deps:
  qdrant:
    enabled: true
    storage: 4Gi
    storageClass: standard
  postgres:
    enabled: true
    storage: 2Gi
    storageClass: standard
  redis:
    enabled: true

ingress:
  enabled: false                # port-forward instead

networkPolicy:
  enabled: true                 # objects apply; kindnet does not enforce (see header)
