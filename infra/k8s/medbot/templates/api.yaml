{{- $c := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "medbot.fullname" . }}-api
  labels: {{- include "medbot.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "medbot.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "medbot.labels" . | nindent 8 }}
        {{- include "medbot.selectorLabels" $c | nindent 8 }}
      annotations:
        # Roll pods when config changes. Without this, `helm upgrade` updates the
        # ConfigMap but leaves pods running the old values — a change that appears to
        # have been applied but has not.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "medbot.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "medbot.image" (dict "root" . "name" "medbot-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          {{- include "medbot.commonEnv" . | nindent 10 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- with .Values.api.probes.startup }}
          startupProbe:
            httpGet: { path: {{ .path }}, port: http }
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- with .Values.api.probes.liveness }}
          livenessProbe:
            httpGet: { path: {{ .path }}, port: http }
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- with .Values.api.probes.readiness }}
          readinessProbe:
            httpGet: { path: {{ .path }}, port: http }
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
      # SSE streams are long-lived (D7). A pod terminating mid-stream must be given time to
      # finish in-flight answers rather than cutting users off at the TCP level.
      terminationGracePeriodSeconds: 45
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medbot.fullname" . }}-api
  labels: {{- include "medbot.labels" . | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "medbot.selectorLabels" $c | nindent 4 }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "medbot.fullname" . }}-api
  labels: {{- include "medbot.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "medbot.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # Scale up fast, down slow. Measured p50 is ~1.1s per query with only ~2 RPS per
    # instance (P5.2), so a traffic spike saturates pods quickly — but flapping replicas
    # would repeatedly pay the cold-start cost and cut live SSE streams.
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "medbot.fullname" . }}-api
  labels: {{- include "medbot.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "medbot.selectorLabels" $c | nindent 6 }}
{{- end }}
