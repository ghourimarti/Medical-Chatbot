# TIER 3 — OBSERVABILITY. Standalone: `docker compose -f docker-compose.observability.yaml up`.
#
# It shares the compose PROJECT (both files live in this directory), so it lands on the
# same default network as the data and app tiers and services resolve each other by name —
# the API can post spans to `otel-collector:4318` without a shared-network declaration.
#
# Langfuse needs a Postgres. It uses the `langfuse` DATABASE created inside the data tier's
# Postgres by infra/postgres/init/, rather than a second server: one container, one backup
# story, and the schemas stay separate. That is why `make obs` expects `make db` first.
services:
  # 11/12. OTel Collector — the vendor-neutral hop. OTEL_ENABLED=false in .env means the
  # app still creates spans and simply does not export them, so nothing breaks without this.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "${OTEL_HTTP_PORT:-5011}:4318"
      - "${OTEL_GRPC_PORT:-5012}:4317"
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otel/config.yaml:ro

  # 13. Prometheus — metrics + the 15 alert rules validated by promtool in P5.5.8.
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "${PROMETHEUS_PORT:-5013}:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  # 14. Grafana — dashboards over Prometheus.
  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "${GRAFANA_PORT:-5014}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # T6 — open the dashboards WITHOUT a login. This is a LOCAL-ONLY convenience and it
      # is safe only because nothing here is exposed beyond localhost. Anonymous is Viewer,
      # never Admin: you can read every panel and change nothing, so a stray click cannot
      # edit a provisioned dashboard. Sign in as admin when you want to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      # Land on the service overview instead of an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/medbot-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioned at boot (T6): datasource UID is FIXED so the committed dashboard JSON
      # is portable, and the dashboards themselves live in git.
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # 15. Langfuse — the ONE sanctioned store for prompt/completion content (D18).
  # Everything else (app logs, OTel spans, metrics) carries only fingerprints, never the
  # question text, which is what makes this the single place to control for PII.
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "${LANGFUSE_WEB_PORT:-5015}:3000"
    environment:
      # Plain `postgresql://` — Langfuse is a Node app and does not know asyncpg.
      DATABASE_URL: postgresql://${POSTGRES_USER:-medbot}:${POSTGRES_PASSWORD:-medbot}@postgres:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      NEXTAUTH_URL: http://localhost:${LANGFUSE_WEB_PORT:-5015}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-langfuse-dev-salt-change-me}
      TELEMETRY_ENABLED: "false"
      # T5 — HEADLESS BOOTSTRAP. Langfuse creates the org, project, user AND pins the API
      # keys to the values below on first boot of an empty database. Because the API reads
      # those same two keys from .env, tracing works the moment the stack is up: no signup,
      # no "create a project", no copying keys between two browser tabs.
      #
      # These run ONLY against an empty Langfuse database. After `make downv` they seed
      # again; on a warm start they are ignored, which is why changing a key here needs a
      # `make downv` to take effect.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-medbot-local}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Medbot Local}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-medbot}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Medical RAG Chatbot}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-medbot-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-medbot-local}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@medbot.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Medbot Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-medbot-admin-1234}

  # 16. Jaeger — the distributed TRACE view (T8).
  #
  # WHY IT IS NEEDED: the OTel Collector was exporting traces to the `debug` exporter,
  # which writes them to its own stdout and nowhere else. The instrumentation existed, the
  # tail-sampling policy existed, and there was no way to LOOK at a trace. Its own config
  # comment said "production exports to Tempo/Jaeger instead".
  #
  # WHY IT DOES NOT DUPLICATE LANGFUSE: Langfuse answers "what did the model see and say,
  # and what did it cost". Jaeger answers "where did the 1.8 seconds go" across
  # HTTP -> embed -> retrieve -> rerank -> generate. When a request is slow, only one of
  # those two tells you which stage to look at.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "${JAEGER_UI_PORT:-5023}:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # In-memory storage: traces are for debugging the run in front of you, and this
      # keeps the local stack to one container with no storage tier to operate.
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "50000"

  # 22. RedisInsight — Redis GUI, with the databases already registered (T7).
  redisinsight:
    image: redis/redisinsight:2.62
    ports:
      - "${REDISINSIGHT_PORT:-5022}:5540"
    environment:
      # Without this the UI opens on a EULA/consent screen and the API refuses writes —
      # which is exactly the "log in and click through" step this is meant to remove.
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_APP_PORT: "5540"
    volumes:
      - redisinsight_data:/data

  # Registers every Redis instance in RedisInsight, then exits. Idempotent: it checks
  # before adding, so `make up` twice does not create duplicates.
  # Behind a profile so it is NOT part of `up --wait`. A one-shot task container exits
  # when it finishes, and `--wait` treats ANY exit as a failure — so a seeder that worked
  # perfectly made `make up` report Error 1 over a healthy stack. A command that cries
  # failure when nothing is wrong is worse than no check at all: it teaches you to ignore
  # the exit code. The Makefile runs this immediately after the stack is up.
  redisinsight-seed:
    profiles: ["seed"]
    image: busybox:1.37
    depends_on:
      redisinsight:
        condition: service_started
    environment:
      RI_URL: http://redisinsight:5540
      REDISINSIGHT_DATABASES: ${REDISINSIGHT_DATABASES:-medbot-cache|redis|6379}
    volumes:
      - ./infra/redisinsight/seed-databases.sh:/seed.sh:ro
    command: ["sh", "/seed.sh"]
    restart: "no"

volumes:
  prom_data:
  grafana_data:
  redisinsight_data:
