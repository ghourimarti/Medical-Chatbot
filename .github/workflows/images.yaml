# Build, scan, and publish the three service images (D15, D16 — S17.1, S17.5).
#
# WHY THIS COULD NOT RUN BEFORE P6.1a: the images were 8.84 / 8.50 / 8.84 GB because torch
# resolved to the CUDA build on Linux, dragging in 16 nvidia-*/triton wheels that no
# CPU-only service can execute. Three of those do not fit a standard runner's ~14 GB of
# disk. Pinning torch to the PyTorch CPU index took the set from 26.18 GB to 6.59 GB
# (docs/IMAGES.md), which is what makes this workflow possible at all.
#
# Registry: GHCR. Not ECR — ECR needs AWS credentials this project does not have yet
# (Track D.1), and the point of the vendor-portability principle is that the registry is a
# swap, not a rewrite. `REGISTRY`/`IMAGE_PREFIX` are the only lines that change.
name: images

# COST (private repo — every minute is billed). Building three ~2.3 GB images is the most
# expensive job here, and rebuilding it on every push to main pays for artifacts nobody
# deploys. Releases are what need images, so: tags and manual only.
#   one-off build:  gh workflow run images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    name: build · scan · push (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # one service's CVE should not hide another's
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: ml
            dockerfile: apps/ml-service/Dockerfile
          - service: worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        # Even at 2.3 GB per image the default runner is tight once the build cache and
        # the base layers are counted. Removing toolchains this build never uses buys
        # ~10 GB and costs seconds.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/medbot-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
          # NOTE: no `latest`. S16 recorded that the demo shipped `:latest` only, which
          # made rollback impossible — there was no earlier tag to roll back TO.

      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true # scan the exact artifact before it is allowed near a registry
          tags: medbot-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: medbot-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true # see below
          exit-code: "1"
          format: table
        # `ignore-unfixed` is a decision with a measurement behind it (P6.1.5): the CRITICAL
        # in these images is perl-base CVE-2026-13221, which Debian marks `affected` with no
        # fixed version published. Failing the build on a CVE with nothing to upgrade to
        # would block every release indefinitely and teach the team to add `|| true` — the
        # exact theatre this pipeline replaced. Unfixed findings are tracked in
        # docs/IMAGES.md and are the argument for the distroless base in Phase 7/8.

      - name: Secret scan of the built image
        # Distinct from gitleaks in ci.yaml: that scans the repo, this scans what actually
        # shipped. P6.1.3 found tests/ (containing a fake `gsk_` literal) inside all three
        # runtime images — present in the artifact, not in any tracked source path.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: medbot-${{ matrix.service }}:ci
          scanners: secret
          exit-code: "1"
          format: table

      - name: Verify image hygiene
        # Cheap assertions on properties that silently regress: a base-image bump can
        # reintroduce root or pip, and nothing else in the pipeline would notice.
        run: |
          set -euo pipefail
          img=medbot-${{ matrix.service }}:ci
          user=$(docker run --rm --entrypoint id "$img" -un)
          [ "$user" = "appuser" ] || { echo "image runs as $user, expected appuser"; exit 1; }
          if docker run --rm --entrypoint sh "$img" -c 'command -v pip' >/dev/null 2>&1; then
            echo "pip is present in the runtime layer (P6.1.5 removed it)"; exit 1
          fi
          echo "hygiene ok: non-root=$user, no pip"

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
