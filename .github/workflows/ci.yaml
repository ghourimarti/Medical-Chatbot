# Per-PR quality pipeline (D16, S17.2 + S17.5).
#
# What is deliberately NOT here: the RAGAS eval gate and the image build. Both need
# resources a PR job should not spend on every push — a full 7,080-chunk index and roughly
# a day of judge quota (measured in S6), and ~7 GB of image build. They live in
# eval-gate.yaml (manual + nightly) and images.yaml (main + tags).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint · types · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync workspace
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy packages/core/src/medcore packages/eval/src/medeval apps/api/src/medapi

      - name: Unit tests
        # Integration-marked tests are excluded here and run in the `integration` job,
        # which has the services they need. Running them without services would skip
        # silently and give a green tick for tests that never executed.
        run: uv run pytest -q -m "not integration"

  integration:
    name: integration (qdrant · postgres · redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medbot
          POSTGRES_USER: medbot
          POSTGRES_PASSWORD: medbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medbot -d medbot"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --frozen

      - name: Cache model weights
        # bge-large + reranker are ~2.4 GB. Without this the job re-downloads them every
        # run, which is slower than the tests themselves and rate-limited by the HF hub.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('uv.lock') }}
          restore-keys: hf-

      - name: Integration tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: gale_ci
          DATABASE_URL: postgresql+asyncpg://medbot:medbot@localhost:5432/medbot
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -q -m integration

  security:
    name: secrets · dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Dependency CVE audit (pip-audit)
        # Non-blocking BY DECISION, not by oversight (P5.1): the audit currently reports
        # findings whose fixes are unavailable to us — langchain-core's fix requires
        # LangChain 1.x, which breaks ragas 0.4.3, and ragas 0.4.3 is already latest. A
        # gate that cannot be satisfied gets bypassed, and then it guards nothing. The
        # findings are triaged in docs/SECURITY_AUDIT.md and docs/IMAGES.md instead.
        run: uv run --with pip-audit pip-audit --progress-spinner off || true

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        # CI that cannot lint itself is the one place a typo survives longest: a malformed
        # workflow does not fail, it silently does not run.
        uses: raven-actions/actionlint@v2
