[project]
name = "medapi"
version = "0.1.0"
description = "FastAPI query service for the P5 medical RAG chatbot (Decisions 2, 5, 6, 7)"
requires-python = ">=3.13"
dependencies = [
    "medcore",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "qdrant-client>=1.12",
    "langchain-core>=0.3,<1",
    "sentence-transformers>=3.0",
    # Declared explicitly (not just pulled via sentence-transformers) so the
    # workspace CPU-index pin in the root pyproject binds — a transitive requirement
    # does not pick up a [tool.uv.sources] override (P6.1a).
    "torch>=2.0",
    "pypdf>=5.0",
    "langchain-text-splitters>=0.3,<1",
    "httpx>=0.27",
    "fastembed>=0.8.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "itsdangerous>=2.2.0",
    "redis>=5.0",
    "boto3>=1.43.72",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "aiohttp>=3.14.2",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "langfuse>=4.14.4",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
# medapi-reindex removed in P5.1: superseded by `medworker-ingest`, which builds a new
# collection and swaps the alias atomically (D11) instead of mutating a live index.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medapi"]
