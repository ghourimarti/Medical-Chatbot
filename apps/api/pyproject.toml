[project]
name = "medapi"
version = "0.1.0"
description = "FastAPI query service for the P5 medical RAG chatbot (Decisions 2, 5, 6, 7)"
requires-python = ">=3.13"
dependencies = [
    "medcore",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "qdrant-client>=1.12",
    "langchain-core>=0.3,<1",
    "langchain-groq<1",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "langchain-text-splitters>=0.3,<1",
    "httpx>=0.27",
]

[project.scripts]
medapi-reindex = "medapi.scripts.reindex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medapi"]
