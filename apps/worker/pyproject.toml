[project]
name = "medworker"
version = "0.1.0"
description = "Queue-driven ingestion + scheduled maintenance (Decisions 11, 1)"
requires-python = ">=3.13"
dependencies = [
    "medcore",
    "medapi",
    "boto3>=1.34",
    "pypdf>=6.15.0",
]

[project.scripts]
medworker = "medworker.consumer:main"
medworker-ingest = "medworker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medworker"]
