[project]
name = "medml"
version = "0.1.0"
description = "CPU inference service: bge-large embeddings + cross-encoder reranking (Decisions 5, 22)"
requires-python = ">=3.13"
# Owns the heavy ML stack so apps/api doesn't have to. This is the point of the split:
# the API image stays slim and scales on request concurrency; this one scales on CPU.
dependencies = [
    "medcore",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sentence-transformers>=5.0",
    # Declared explicitly (not just pulled via sentence-transformers) so the
    # workspace CPU-index pin in the root pyproject binds — a transitive requirement
    # does not pick up a [tool.uv.sources] override (P6.1a).
    "torch>=2.0",
    "pydantic>=2.8",
]

[project.scripts]
medml-serve = "medml.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medml"]
